name: miso-lynx CI
on:
  push:
    branches:
      - master
  pull_request:

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     - uses: DeterminateSystems/nix-installer-action@main
     - uses: actions/checkout@v3.5.3
     - name: Cancel Previous Runs
       uses: styfle/cancel-workflow-action@0.9.1
       with:
         access_token: ${{ github.token }}
     - uses: cachix/cachix-action@v16
       with:
         name: haskell-miso-cachix
         authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

     - name: (JS) miso-lynx counter example (GHC-JS native, LynxJS dual-thread)
       run: nix build .#miso-lynx-examples -L

     - name: Bundle the counter example (mkLynxBundle)
       run: nix build .#counter-bundle -L

     - name: Nix garbage collect
       run: nix-collect-garbage -d
